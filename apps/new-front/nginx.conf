# Imita backend bucket + Cloud CDN. Nao conhece o prefixo /new: a borda o
# remove antes de repassar, como o pathPrefixRewrite do URL map.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hash no nome do arquivo: cache pode ser eterno.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Unico arquivo sem hash: cachear = servir front velho depois do deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"new-front"}';
    }
}
