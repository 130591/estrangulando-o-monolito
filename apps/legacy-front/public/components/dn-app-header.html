<header class="dn-header">
  <div class="dn-header__inner">
    <div class="dn-header__left">
      <a href="/notas"><dn-brand size="sm"></dn-brand></a>

      <div class="dn-header__divider"></div>

      <nav class="dn-nav">
        <a href="/notas" ng-class="{ 'is-active': vm.active === 'notas' }">Minhas notas</a>
        <a href="/arquivadas" ng-class="{ 'is-active': vm.active === 'arquivadas' }">Arquivadas</a>
      </nav>
    </div>

    <div class="dn-header__right">
      <a class="dn-btn dn-btn--mono" ng-href="/{{ vm.user.username }}">/{{ vm.user.username }}</a>

      <button type="button" class="dn-btn dn-btn--primary" ng-click="vm.onAdd()">
        <span class="dn-btn__plus">+</span> Adicionar nota
      </button>

      <div class="dn-menu">
        <button type="button"
                class="dn-menu__button"
                aria-label="Menu da conta"
                ng-click="vm.toggleMenu($event)">
          <span class="dn-avatar">{{ vm.user.initials }}</span>
        </button>

        <div class="dn-menu__panel" ng-if="vm.menuOpen" ng-click="$event.stopPropagation()">
          <span class="dn-menu__label">
            {{ vm.user.email }}
            <!-- De qual backend veio o token. Depois que a borda desvia
                 /api/auth, este rotulo muda sozinho. -->
            <br ng-if="vm.via">sessao via {{ vm.via }}
          </span>
          <a class="dn-menu__item" ng-href="/{{ vm.user.username }}">Ver meu perfil</a>
          <button type="button" class="dn-menu__item" ng-click="vm.logout()">Sair</button>
        </div>
      </div>
    </div>
  </div>
</header>
