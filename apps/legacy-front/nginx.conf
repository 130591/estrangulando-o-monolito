server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Nada aqui tem hash no nome: cache longo entregaria versao velha.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"legacy-front"}';
    }
}
