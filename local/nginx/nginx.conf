# =============================================================================
# URL MAP LOCAL
#
# Este arquivo decide, path a path, quem e dono de cada rota. O que estiver
# aqui tem que valer tambem no GCP: se divergir do URL map, o que funciona
# local nao funciona em producao.
#
# Estado atual: etapa 0. O legado inteiro atras da borda, nada migrado.
#
# TODO: rotear /api para o legacy-api (sem isso, POST /api/* cai no front)
# TODO: rotear /api/example/items para o new-service
# TODO: publicar o new-front em /new/
# TODO: propagar x-request-id da borda ate os dois backends, e devolve-lo
# TODO: index.html sem cache, assets hasheados com cache longo
# =============================================================================

server {
	listen 8080;
	server_name _;

	# Saude da propria borda: responde aqui, sem consultar backend nenhum.
	# Proxyar isso faria o edge ficar unhealthy quando o doente e outro.
	location = /_edge/healthz {
		access_log off;
		default_type application/json;
		return 200 '{"status":"ok","service":"edge"}';
	}

	# Etapa 0: todo o resto e do legado. As rotas migradas vao entrar ACIMA
	# deste bloco, com prefixo mais especifico.
	location / {
		proxy_pass http://legacy-front:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api {
		proxy_pass http://legacy-api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
