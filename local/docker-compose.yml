name: estrangulando-o-monolito

services:
  # Representa o Application Load Balancer: e por aqui que o roteamento passa.
  edge:
    image: nginx:1.27-alpine
    container_name: edge
    ports:
      - "${EDGE_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      legacy-front:
        condition: service_healthy
      legacy-api:
        condition: service_healthy
      new-front:
        condition: service_healthy
      new-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_edge/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Vira Cloud SQL for MySQL no GCP. Compartilhado entre legado e new-service
  # durante a coexistencia: separar os dados e uma migracao a parte.
  mysql:
    image: mysql:8.4
    container_name: mysql
    # O driver `mysql` 2.x, unico que roda em Node 9, so fala
    # mysql_native_password: com o default do 8.4 o legado responde
    # ER_NOT_SUPPORTED_AUTH_MODE em toda query. O lado mais velho dita a
    # configuracao do banco compartilhado - e o MySQL 9 ja removeu o plugin.
    command: >-
      --mysql-native-password=ON
      --authentication-policy=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-app}"
      MYSQL_USER: "${MYSQL_USER:-app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-app}"
    ports:
      # Conveniencia local. Cloud SQL nao tem IP publico: o acesso e por
      # private IP ou Cloud SQL Auth Proxy.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # So rodam na primeira subida do volume; para reaplicar depois de
      # mexer no SQL, derrube com `down --volumes`.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Node 9 (EOL). Sem `ports:` de proposito - ver docs/adr/0001.
  legacy-api:
    build:
      context: ../apps/legacy-api
    container_name: legacy-api
    environment:
      PORT: "8080"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-app}"
      DB_USER: "${MYSQL_USER:-app}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-app}"
      # O MESMO do new-service: e o que faz o token emitido aqui valer la.
      JWT_SECRET: "${JWT_SECRET:-dev-notes-segredo-local-nao-use-em-producao}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # node:9-slim nao tem curl nem wget.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/healthz',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  legacy-front:
    build:
      context: ../apps/legacy-front
    container_name: legacy-front
    ports:
      - "${LEGACY_FRONT_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  new-service:
    build:
      context: ../apps/new-service
    container_name: new-service
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "8080"
      ROUTE_PREFIX: "${NEW_SERVICE_ROUTE_PREFIX:-api}"
      SERVICE_NAME: "new-service"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-app}"
      DB_USER: "${MYSQL_USER:-app}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-app}"
      # Identico ao do legacy-api: divergir desloga todo mundo no desvio.
      JWT_SECRET: "${JWT_SECRET:-dev-notes-segredo-local-nao-use-em-producao}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  new-front:
    build:
      context: ../apps/new-front
      args:
        VITE_BASE_PATH: "${NEW_FRONT_BASE_PATH:-/new/}"
        VITE_API_BASE_URL: "${NEW_FRONT_API_BASE_URL:-/api}"
    container_name: new-front
    # Atalho de debug: o caminho normal e pela borda.
    ports:
      - "${NEW_FRONT_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
