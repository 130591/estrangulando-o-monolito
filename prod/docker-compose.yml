version: '3.8'

services:
  edge:
    image: nginx:latest
    ports:
      - "8080:8080"  O nginx interno escuta na 8080
    volumes:
      - ./local/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Montagem correta para não quebrar a sintaxe principal
    depends_on:
      - legacy-front
      - legacy-api

  legacy-front:
    image: us-central1-docker.pkg.dev/gcp-migration-506723/apps/legacy-front:v1
    environment:
      - API_URL=http://legacy-api:8080

  legacy-api:
    image: us-central1-docker.pkg.dev/gcp-migration-506723/apps/legacy-api:v1
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}